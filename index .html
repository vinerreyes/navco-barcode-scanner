<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NAVCO Barcode Scanner</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:14px Arial,sans-serif;background:#edf2f7;color:#123b65;margin:0;padding:16px}main{max-width:480px;margin:auto;background:white;padding:16px;border-radius:10px}h2{font-size:18px}button{background:#0b5394;color:white;border:0;border-radius:5px;padding:12px;width:100%;margin:6px 0}#reader{width:100%}#result{overflow-wrap:anywhere} </style></head><body><main><h2>NAVCO Barcode Scanner</h2><p id="status" role="status">Tap Start Camera to scan a barcode.</p><div id="reader"></div><button id="start">Start Camera</button><button id="stop">Stop Camera</button><p id="result"></p><button id="copy" hidden>Copy Barcode</button></main><script>let scanner, busy=false, value='';const el=id=>document.getElementById(id);async function stop(){if(scanner&&scanner.isScanning)await scanner.stop();}async function found(text){if(busy)return;busy=true;value=text;el('result').textContent='Barcode: '+text;el('copy').hidden=false;el('status').textContent='Barcode detected.';try{await stop()}catch(e){} }el('start').onclick=async()=>{if(scanner&&scanner.isScanning)return;busy=false;el('copy').hidden=true;el('result').textContent='';el('status').textContent='Starting camera...';try{if(!window.Html5Qrcode)throw Error('Scanner library unavailable');scanner=scanner||new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(w*.85),height:Math.floor(h*.45)})},found,()=>{});if(!busy)el('status').textContent='Point the camera at the barcode.'}catch(e){el('status').textContent='Camera unavailable: '+(e.message||String(e))}};el('stop').onclick=async()=>{try{await stop();el('status').textContent='Camera stopped.'}catch(e){el('status').textContent=String(e)}};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(value);el('status').textContent='Barcode copied.'}catch(e){el('status').textContent='Copy the barcode shown above manually.'}};window.addEventListener('pagehide',()=>{stop().catch(()=>{})});</script></body></html>
